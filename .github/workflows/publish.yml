name: Publish

# Auto-triggered when a release PR (opened by release.yml) is merged into main.
# The contract is the merge commit's title: `release(apptrove-sdk): v<version>`.
# If the head commit on a push to main doesn't match, this workflow no-ops.
#
# On match, this workflow:
#   1. Verifies packages/apptrove-sdk/package.json version equals the parsed version.
#   2. Verifies the version isn't already published to the verdaccio registry.
#   3. Publishes @app-brew/apptrove-sdk@<version> to AppBrew's private npm
#      (https://npm.appbrew.tech/) using the VERDACCIO_NPM_TOKEN write token.
#   4. Tags the merge commit as @app-brew/apptrove-sdk@<version> and pushes.
#   5. Creates a GitHub Release for that tag.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-apptrove-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Parse release commit message
        id: parse
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Match only the first line of the commit message.
          # The version capture stops at the first whitespace so a trailing
          # `(#NN)` appended by GitHub's squash-merge does not get folded into
          # the captured version string.
          FIRST_LINE=$(printf '%s' "$MESSAGE" | head -n1)
          if [[ "$FIRST_LINE" =~ ^release\(apptrove-sdk\):\ v([^[:space:]]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Detected release commit: @app-brew/apptrove-sdk@$VERSION"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "Head commit is not a release commit. Skipping publish."
            echo "First line was: $FIRST_LINE"
          fi

      - name: Checkout release commit
        if: steps.parse.outputs.match == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install toolchain (mise)
        if: steps.parse.outputs.match == 'true'
        uses: jdx/mise-action@v2

      - name: Verify package.json version matches commit
        if: steps.parse.outputs.match == 'true'
        env:
          EXPECTED: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(node -p "require('./packages/apptrove-sdk/package.json').version")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version ($ACTUAL) does not match release commit version ($EXPECTED). Refusing to publish."
            exit 1
          fi
          echo "Version check passed: $ACTUAL"

      - name: Verify version not already published
        if: steps.parse.outputs.match == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          # Reads use the committed read-only token in the repo .npmrc; the
          # @app-brew scope already resolves to https://npm.appbrew.tech/.
          if npm view "@app-brew/apptrove-sdk@${VERSION}" version --silent >/dev/null 2>&1; then
            echo "::error::@app-brew/apptrove-sdk@${VERSION} is already published. Bump the version and try again."
            exit 1
          fi
          echo "Version ${VERSION} is not yet published. Proceeding."

      - name: Publish to AppBrew private npm
        if: steps.parse.outputs.match == 'true'
        working-directory: packages/apptrove-sdk
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          VERDACCIO_NPM_TOKEN: ${{ secrets.VERDACCIO_NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERDACCIO_NPM_TOKEN:-}" ]; then
            echo "::error::VERDACCIO_NPM_TOKEN secret is not set. Add a verdaccio write token scoped to @app-brew/apptrove-sdk in the repo's npm-publish environment."
            exit 1
          fi
          # The committed repo .npmrc carries the read-only token; pass the write
          # token on the command line so it overrides for publish only (CLI config
          # beats the project .npmrc). publishConfig.registry targets verdaccio.
          REGISTRY=https://npm.appbrew.tech/
          AUTH="--//npm.appbrew.tech/:_authToken=${VERDACCIO_NPM_TOKEN}"
          # Prereleases publish under the prerelease identifier as the dist-tag
          # so `latest` never moves to a non-stable version.
          if [[ "$VERSION" == *-* ]]; then
            PREID="${VERSION#*-}"     # strip up to and including the first '-'
            PREID="${PREID%%.*}"      # strip from the first '.' onward
            echo "Prerelease detected, publishing under dist-tag: $PREID"
            npm publish --registry "$REGISTRY" "$AUTH" --tag "$PREID"
          else
            npm publish --registry "$REGISTRY" "$AUTH"
          fi

      - name: Tag the release commit
        if: steps.parse.outputs.match == 'true'
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          TAG="@app-brew/apptrove-sdk@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.parse.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          TAG="@app-brew/apptrove-sdk@${VERSION}"

          # Mark as prerelease if version contains a hyphen (semver prerelease suffix).
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Pull the latest tag matching our scope/name from before this one to scope the changelog.
          PREV_TAG=$(git tag -l "@app-brew/apptrove-sdk@*" --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s (%h)' -- packages/apptrove-sdk || true)
            HEADER="Changes since \`${PREV_TAG}\`:"
          else
            NOTES=$(git log "${TAG}" --pretty=format:'- %s (%h)' -- packages/apptrove-sdk || true)
            HEADER="First release of \`@app-brew/apptrove-sdk\`."
          fi
          if [ -z "$NOTES" ]; then
            NOTES="_(no commits touched packages/apptrove-sdk in this range)_"
          fi

          BODY=$(printf '%s\n\n%s\n\nPublished to AppBrew private npm (https://npm.appbrew.tech/) as @app-brew/apptrove-sdk@%s\n' "$HEADER" "$NOTES" "$VERSION")

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            $PRERELEASE_FLAG
